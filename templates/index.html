<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点导航 · 网关</title>
    <style>
        /* 基础变量 —— 默认暗色 */
        :root {
            --bg-color: #1a1e24;
            --card-bg: #252a33;
            --text-color: #e4e6eb;
            --text-secondary: #9ca3af;
            --border-color: #3a404a;
            --hover-bg: #2e3540;
            --badge-local-bg: #2563eb;
            --badge-proxy-bg: #16a34a;
            --link-color: #60a5fa;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        /* 亮色模式变量 */
        html.light {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --hover-bg: #f3f4f6;
            --badge-local-bg: #3498db;
            --badge-proxy-bg: #27ae60;
            --link-color: #2563eb;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.2s, color 0.2s;
        }

        /* 右上角工具栏 */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
        }

        .theme-toggle .icon {
            font-size: 1.2rem;
            line-height: 1;
        }

        h1 {
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .tree {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px 30px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .site-item {
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .site-item:hover {
            background: var(--hover-bg);
        }

        .site-link {
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            color: white;
            font-weight: 500;
        }

        .badge.local {
            background: var(--badge-local-bg);
        }

        .badge.proxy {
            background: var(--badge-proxy-bg);
        }

        .footer {
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
        }

        a {
            color: var(--link-color);
        }

        code {
            background: var(--hover-bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="theme-toggle" id="themeToggle" title="切换亮色/暗色模式">
            <span class="icon" id="themeIcon">🌙</span>
        </button>
    </div>

    <div class="tree">
        <h1>📁 站点导航</h1>
        {% if sites %}
            {% for site in sites %}
            <div class="site-item">
                <a class="site-link" href="/{{ site.path }}/">
                    <span>📄 {{ site.name }}</span>
                    {% if site.type == 'local' %}
                    <span class="badge local">本地</span>
                    {% else %}
                    <span class="badge proxy">代理</span>
                    {% endif %}
                </a>
            </div>
            {% endfor %}
        {% else %}
            <p style="color: var(--text-secondary);">暂无站点。请在 <code>webs/</code> 目录下添加本地站点或 <code>index.json</code> 配置。</p>
        {% endif %}
        <div class="footer">
            PoweredBy <a href="https://github.com/SmallJiu">small_jiu</a>
        </div>
    </div>

    <script>
        (function() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // 获取存储的主题，默认为 dark
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.textContent = '☀️';
            } else {
                // 默认暗色，确保类存在
                html.classList.add('dark');
                html.classList.remove('light');
                themeIcon.textContent = '🌙';
            }

            // 切换主题
            function toggleTheme() {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    localStorage.setItem('theme', 'light');
                    themeIcon.textContent = '☀️';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    themeIcon.textContent = '🌙';
                }
            }

            toggleBtn.addEventListener('click', toggleTheme);
        })();
    </script>
</body>
</html>
